openapi: 3.0.3
info:
  title: Taskify Projects API
  description: |
    REST API for managing projects in Taskify MVP.

    **Features**:
    - List all projects
    - Get project details with tasks
    - Create new projects
    - Update existing projects

    **Authentication**: None (MVP - no auth required per FR-015)
  version: 1.0.0
  contact:
    name: Taskify Team
    email: support@taskify.com

servers:
  - url: https://api/v1
    description: Local development (Aspire service discovery)
  - url: https://localhost:7001/v1
    description: API service direct access

tags:
  - name: projects
    description: Project management operations

paths:
  /projects:
    get:
      tags:
        - projects
      summary: List all projects
      description: Retrieve all projects with basic information (excludes tasks)
      operationId: listProjects
      responses:
        '200':
          description: Successfully retrieved project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
              examples:
                projects:
                  summary: List of three sample projects
                  value:
                    - id: 1
                      name: "Website Redesign"
                      description: "Modernize company website UI/UX"
                      taskCount: 7
                      createdAt: "2026-02-15T00:00:00Z"
                    - id: 2
                      name: "Mobile App Development"
                      description: "Build iOS and Android apps"
                      taskCount: 7
                      createdAt: "2026-02-15T00:00:00Z"
                    - id: 3
                      name: "Marketing Campaign"
                      description: "Q1 product launch campaign"
                      taskCount: 6
                      createdAt: "2026-02-15T00:00:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - projects
      summary: Create a new project
      description: Create a new project with name and description
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            examples:
              newProject:
                summary: New project creation
                value:
                  name: "DevOps Pipeline"
                  description: "Automate CI/CD processes"
      responses:
        '201':
          description: Project created successfully
          headers:
            Location:
              description: URI of the created project
              schema:
                type: string
                example: "/v1/projects/4"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{projectId}:
    get:
      tags:
        - projects
      summary: Get project details
      description: Retrieve a single project with all tasks organized by status
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Successfully retrieved project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetails'
              examples:
                projectWithTasks:
                  summary: Project with tasks in different statuses
                  value:
                    id: 1
                    name: "Website Redesign"
                    description: "Modernize company website UI/UX"
                    tasks:
                      - id: 1
                        title: "Design new homepage"
                        status: "In Progress"
                        assignedTo:
                          id: 2
                          name: "Marcus Rodriguez"
                      - id: 2
                        title: "Implement navigation menu"
                        status: "To Do"
                        assignedTo:
                          id: 3
                          name: "Aisha Patel"
                    createdAt: "2026-02-15T00:00:00Z"
                    updatedAt: "2026-02-15T10:30:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - projects
      summary: Update project
      description: Update project name and/or description
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
            examples:
              updateName:
                summary: Update project name
                value:
                  name: "Website Redesign v2"
                  description: "Modernize company website UI/UX with responsive design"
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Unique identifier for the project
      schema:
        type: integer
        minimum: 1
        example: 1

  schemas:
    ProjectSummary:
      type: object
      description: Basic project information for list views
      required:
        - id
        - name
        - description
        - taskCount
        - createdAt
      properties:
        id:
          type: integer
          description: Unique project identifier
          example: 1
        name:
          type: string
          maxLength: 200
          description: Project name
          example: "Website Redesign"
        description:
          type: string
          maxLength: 1000
          description: Project description
          example: "Modernize company website UI/UX"
        taskCount:
          type: integer
          description: Total number of tasks in this project
          example: 7
        createdAt:
          type: string
          format: date-time
          description: Project creation timestamp (ISO 8601 UTC)
          example: "2026-02-15T00:00:00Z"

    ProjectDetails:
      type: object
      description: Complete project information including tasks
      required:
        - id
        - name
        - description
        - tasks
        - createdAt
      properties:
        id:
          type: integer
          description: Unique project identifier
          example: 1
        name:
          type: string
          maxLength: 200
          description: Project name
          example: "Website Redesign"
        description:
          type: string
          maxLength: 1000
          description: Project description
          example: "Modernize company website UI/UX with responsive design"
        tasks:
          type: array
          description: All tasks in this project
          items:
            $ref: '#/components/schemas/TaskSummary'
        createdAt:
          type: string
          format: date-time
          description: Project creation timestamp (ISO 8601 UTC)
          example: "2026-02-15T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Last update timestamp (ISO 8601 UTC)
          example: "2026-02-15T10:30:00Z"

    TaskSummary:
      type: object
      description: Task summary for project views
      required:
        - id
        - title
        - status
        - position
      properties:
        id:
          type: integer
          description: Unique task identifier
          example: 1
        title:
          type: string
          maxLength: 200
          description: Task title
          example: "Design new homepage"
        status:
          type: string
          enum: ["To Do", "In Progress", "In Review", "Done"]
          description: Current task status
          example: "In Progress"
        position:
          type: integer
          description: Position within status column
          example: 0
        assignedTo:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      description: Basic user information
      required:
        - id
        - name
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 5
          description: User identifier (1-5 for MVP)
          example: 2
        name:
          type: string
          description: User's full name
          example: "Marcus Rodriguez"
        role:
          type: string
          enum: ["ProductManager", "Engineer"]
          description: User's role
          example: "Engineer"

    CreateProjectRequest:
      type: object
      description: Request body for creating a new project
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Project name (no HTML tags allowed)
          example: "DevOps Pipeline"
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: Project description (no HTML tags allowed)
          example: "Automate CI/CD processes with GitHub Actions"

    UpdateProjectRequest:
      type: object
      description: Request body for updating a project
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Updated project name (no HTML tags allowed)
          example: "Website Redesign v2"
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: Updated project description (no HTML tags allowed)
          example: "Modernize company website UI/UX with responsive design and accessibility improvements"

    ErrorResponse:
      type: object
      description: Standard error response format
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code or type
          example: "ValidationError"
        message:
          type: string
          description: Human-readable error description
          example: "Project name must not exceed 200 characters"
        details:
          type: object
          description: Additional error context (optional)
          additionalProperties: true
          example:
            field: "name"
            provided: 250
            maximum: 200

  responses:
    BadRequest:
      description: Invalid request parameters or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              summary: Validation error
              value:
                error: "ValidationError"
                message: "Project name is required"
                details:
                  field: "name"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            projectNotFound:
              summary: Project not found
              value:
                error: "NotFound"
                message: "Project with ID 999 not found"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              summary: Server error
              value:
                error: "InternalServerError"
                message: "An unexpected error occurred. Please try again later."
